# The local Kubernetes cluster: one control-plane and three workers.
#
# Three workers, not one, because the point of this repo is that the data layer survives losing a
# machine. CloudNativePG spreads three PostgreSQL instances one per node and the Redis operator
# does the same with its three replicas -- on a single-node cluster both would be co-located and
# `make drill` would prove nothing.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: n8n

nodes:
  - role: control-plane
    # Pinned so the cluster is the same Kubernetes version on every machine and in CI.
    image: kindest/node:v1.34.0
    # Traefik is published as a NodePort on 30080 (see scripts/20-operators.sh). Forwarding the
    # host's port 80 to it is what lets you reach the editor with no port suffix.
    #
    # IPv4 only, and that has a consequence worth knowing about. Docker publishes one address
    # family per mapping, and kind rejects a second mapping on the same host port, so there is no
    # way to listen on both from here. Meanwhile `n8n.localtest.me` resolves to BOTH 127.0.0.1
    # and ::1, and browsers prefer the IPv6 answer -- which nothing is listening on, so they
    # report ERR_CONNECTION_REFUSED while curl quietly falls back to IPv4 and looks fine.
    # The /etc/hosts entry in the README fixes it; see "Getting in".
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: "0.0.0.0"
        protocol: TCP

  - role: worker
    image: kindest/node:v1.34.0
  - role: worker
    image: kindest/node:v1.34.0
  - role: worker
    image: kindest/node:v1.34.0
