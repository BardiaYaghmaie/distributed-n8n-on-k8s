# PostgreSQL: n8n's database. Workflow definitions, encrypted credentials, execution history.
# Main and every Worker read and write this one database -- that shared state is what lets a
# Worker execute a workflow that Main created.
#
# It is a CloudNativePG `Cluster`, not a StatefulSet. The difference is failover. A StatefulSet
# restarts a dead PostgreSQL pod; it has no idea what a primary is, so losing the node the primary
# was on means an outage until that node comes back. CloudNativePG runs three instances with
# streaming replication, watches the primary, and promotes a replica when it goes away -- then
# repoints the `-rw` Service at the new primary, which is the part n8n actually depends on.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-pg
  namespace: n8n
spec:
  # One primary and two replicas. Three, not two, because a two-instance cluster cannot tell a
  # network partition from a dead peer.
  instances: 3

  # Pinned rather than left to the operator's default, so an operator upgrade never silently
  # becomes a PostgreSQL major-version upgrade.
  #
  # The "minimal" variant, not the "system" one the operator defaults to: 81 MB against 265 MB,
  # which is most of a minute off a cold `make all`. It drops the extra tooling that backup
  # plugins want -- add it back if you configure backups, which docs/production.md covers.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie

  bootstrap:
    initdb:
      # Creates the database and its owner on first start. The operator generates the password
      # and puts it in a Secret named after the cluster -- `n8n-pg-app` -- which is what the n8n
      # Deployments read. No password for this database is ever generated by a script or written
      # to git; the component that owns the database owns its credential.
      database: n8n
      owner: n8n

  storage:
    size: 2Gi

  postgresql:
    parameters:
      # Main plus every Worker holds a connection pool, and KEDA scales Workers to 10. The
      # default of 100 is enough for that, but not enough to also leave room for the operator's
      # own connections and a `psql` session while debugging.
      max_connections: "200"

  affinity:
    # Spread the three instances across nodes. Without this Kubernetes is free to put all three
    # on one machine, and the whole point of running three is that one machine can be lost.
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
