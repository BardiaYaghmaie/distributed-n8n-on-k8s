# n8n Main: the editor UI, the REST API, and the webhook endpoint.
#
# In queue mode Main does not run workflows. When a webhook arrives it writes the execution row
# to PostgreSQL, pushes a job to Redis, and holds the HTTP connection until a Worker reports back.
# Its cost per execution is one insert and one push, which is why one replica serves far more
# traffic than one executing instance could.
#
# One replica, and that is the platform's remaining single point of failure. Running two would
# need N8N_MULTI_MAIN_SETUP_ENABLED so they elect a leader for schedule triggers and webhook
# registration -- without it, two Mains fire every cron workflow twice. That flag is an n8n
# Enterprise feature; see docs/production.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-main
  namespace: n8n
  labels:
    app: n8n
    component: main
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
      component: main
  template:
    metadata:
      labels:
        app: n8n
        component: main
    spec:
      containers:
        - name: n8n
          image: docker.io/n8nio/n8n:2.37.10
          ports:
            - name: http
              containerPort: 5678
          envFrom:
            # Shared with the Workers: database, queue, and the behaviour both must agree on.
            - configMapRef:
                name: n8n-common
            # Main's own: the HTTP server settings a Worker has no use for.
            - configMapRef:
                name: n8n-main
          env:
            # Generated by CloudNativePG when it created the database. Nothing else knows this
            # password and nothing needs to -- it is never in git and never in a script.
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-pg-app
                  key: username
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-pg-app
                  key: password
            - name: QUEUE_BULL_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-redis
                  key: password
            # The key n8n encrypts stored credentials with. Main and every Worker must have the
            # same value: a Worker with a different key cannot decrypt the credentials attached to
            # the workflow it was handed, and the execution fails at the node that uses them.
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-app
                  key: encryptionKey
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          # /healthz answers as soon as the HTTP server is listening. Deliberately not a database
          # check: if PostgreSQL is unreachable, restarting Main does not help and a restart loop
          # only makes the recovery noisier.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-main
  namespace: n8n
  labels:
    app: n8n
    component: main
spec:
  # Selects component=main only. Workers run an HTTP server for health checks and nothing else;
  # a webhook must never reach one.
  selector:
    app: n8n
    component: main
  ports:
    - name: http
      port: 5678
      targetPort: http
