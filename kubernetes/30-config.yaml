# n8n's non-secret configuration, split three ways.
#
# One ConfigMap for everything would be simpler to write and worse to own: it makes every
# variable look like it applies to every component, so nobody can tell from the file whether
# changing N8N_SECURE_COOKIE affects the Workers. Splitting it puts that answer in the file.
#
# The split is by *who reads the variable*, not by topic:
#
#   n8n-common   both roles read it, and they must agree -- database, queue, encryption-adjacent
#                behaviour. Divergence here does not fail at startup, it fails later as
#                executions that vanish.
#   n8n-main     only the process that serves HTTP reads it.
#   n8n-worker   only the process that consumes the queue reads it.
#
# The rule for adding a variable: it goes in n8n-common unless you can name the reason the other
# role never reads it.
#
# Passwords and the encryption key are not here. They are Secrets -- generated by
# scripts/30-secrets.sh, or by CloudNativePG -- and referenced one key at a time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-common
  namespace: n8n
data:
  # ---- Database -------------------------------------------------------------------------
  # n8n defaults to a local SQLite file, which cannot be shared between pods. PostgreSQL is what
  # makes a multi-pod deployment possible at all.
  DB_TYPE: postgresdb
  # CloudNativePG's read-write Service. It always resolves to the current primary -- after a
  # failover the operator repoints it, and n8n reconnects to the new primary without knowing a
  # failover happened.
  DB_POSTGRESDB_HOST: n8n-pg-rw
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: n8n

  # ---- Queue ----------------------------------------------------------------------------
  # The single most important line in this repository. In the default "regular" mode Main
  # executes workflows itself, and a second replica is just a second n8n. Queue mode makes Main a
  # producer: it enqueues the execution and a Worker consumes it.
  EXECUTIONS_MODE: queue
  # redis-operator's master Service, repointed by the operator when Sentinel elects a new master.
  QUEUE_BULL_REDIS_HOST: n8n-redis-master
  QUEUE_BULL_REDIS_PORT: "6379"

  # ---- Behaviour both roles need to agree on ---------------------------------------------
  # In queue mode, "Test workflow" in the editor still runs on Main unless this is set. With it,
  # Main executes nothing at all -- and n8n warns on startup when it is left unset.
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"

  # Lets a workflow read environment variables through the $env expression; n8n blocks this by
  # default. It is on because the sample workflow returns $env.HOSTNAME, which under Kubernetes
  # is the pod name -- the evidence that a Worker, not Main, ran the execution.
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

  # Both roles render webhook URLs: Main when it shows one in the editor, a Worker when a Wait
  # node produces a resume URL mid-execution. If they disagreed, resume URLs would point
  # somewhere unreachable.
  N8N_WEBHOOK_URL: http://n8n.localtest.me/

  # Executions are pruned after a day so the database does not grow without bound on a cluster
  # that gets rebuilt regularly.
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "24"

  # Prometheus metrics on /metrics for both roles. Nothing scrapes them here -- no monitoring
  # stack is installed -- but the endpoint exists, so pointing an existing Prometheus at this
  # deployment needs no change to these manifests.
  N8N_METRICS: "true"

  GENERIC_TIMEZONE: UTC
  # No telemetry from a local cluster.
  N8N_DIAGNOSTICS_ENABLED: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-main
  namespace: n8n
data:
  # A Worker runs no web server, so none of these mean anything to it.

  # n8n builds the URLs it displays from these three.
  N8N_HOST: n8n.localtest.me
  N8N_PROTOCOL: http
  N8N_PORT: "5678"

  # n8n marks its login cookie Secure by default, meaning "only send me over HTTPS". This
  # deployment serves plain HTTP, so a browser refuses to store that cookie and the editor login
  # silently fails. This is the right setting ONLY because there is no TLS here -- see
  # docs/security.md.
  N8N_SECURE_COOKIE: "false"

  # Behind a Gateway every request arrives from the proxy's address. This tells n8n to trust one
  # hop of X-Forwarded-For, so it logs and rate-limits on the real client IP.
  N8N_PROXY_HOPS: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-worker
  namespace: n8n
data:
  # A Worker serves no traffic, so it starts no HTTP server -- and then its probes have nothing
  # to talk to and the pod never goes Ready. This opens the port for health checks only.
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  QUEUE_HEALTH_CHECK_PORT: "5678"
