# Redis: the execution queue, and the component that makes this platform distributed.
#
# In queue mode n8n Main does not run workflows. It pushes a job onto a Redis list (BullMQ) and
# answers the HTTP request; the Workers block on that same list and whichever is free takes the
# job. Redis is the only thing they share for handing work over, which is why Main and Workers
# scale independently.
#
# Three replicas managed by redis-operator, with Sentinel watching them. On losing the master,
# Sentinel elects a replica and the operator repoints the `n8n-redis-master` Service at it. That
# Service is the whole mechanism: n8n has no Sentinel-aware client -- QUEUE_BULL_REDIS_HOST takes
# a single host -- so failover has to be invisible from the client's side, resolved by DNS.
---
# Redis reads its settings from a file, and this is how the operator injects extra lines into it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-redis-config
  namespace: n8n
data:
  redis-additional.conf: |
    # A queue must never be evicted. Under memory pressure Redis's default policy would silently
    # drop keys -- which here means executions that were accepted and then quietly never ran.
    # noeviction makes Redis reject new writes instead, so the platform fails loudly.
    maxmemory-policy noeviction
    # Append-only persistence, flushed once a second. It does not make the queue durable in any
    # strong sense -- up to a second of accepted jobs can still be lost -- but it means a Redis
    # restart resumes with the queue it had rather than an empty one.
    appendonly yes
    appendfsync everysec
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: n8n-redis
  namespace: n8n
spec:
  # One master and two replicas. Sentinel needs a majority to agree on a failover, and two nodes
  # cannot form one.
  clusterSize: 3

  kubernetesConfig:
    image: quay.io/opstree/redis:v8.10.1
    # The same Secret n8n reads QUEUE_BULL_REDIS_PASSWORD from, so both sides cannot disagree
    # about the password. Generated by scripts/30-secrets.sh.
    redisSecret:
      name: n8n-redis
      key: password
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  redisConfig:
    # Points at the ConfigMap above.
    additionalRedisConfig: n8n-redis-config

  # The operator's image runs Redis as uid 1000, and the mounted PVC is root-owned without this.
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000

  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: n8n-redis-sentinel
  namespace: n8n
spec:
  # Three Sentinels for the same reason as three Redis nodes: a quorum of two means one Sentinel
  # can be lost and the remaining pair can still agree that the master is gone.
  clusterSize: 3

  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v8.10.1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

  redisSentinelConfig:
    # Which replication group to watch. This name is what ties the two resources together.
    redisReplicationName: n8n-redis
    # Sentinel authenticates to the Redis nodes with the same password n8n uses.
    redisReplicationPassword:
      secretKeyRef:
        name: n8n-redis
        key: password
    quorum: "2"
    # Declare the master down after 5s of silence, and allow 10s for the failover to complete.
    # Both are deliberately short: a queue that is not accepting jobs is a visible outage, and
    # the cost of a false positive is a failover to an up-to-date replica.
    downAfterMilliseconds: "5000"
    failoverTimeout: "10000"
